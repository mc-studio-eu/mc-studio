<svg
  xmlns="http://www.w3.org/2000/svg"
  width="230"
  height="94"
  viewBox="0 0 230 94"
  role="img"
  aria-labelledby="mc-studio-title"
>
  <title id="mc-studio-title">MC Studio</title>

  <defs>
    <linearGradient id="tile-gradient" x1="7" y1="5" x2="91" y2="91" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171816" />
      <stop offset="0.55" stop-color="#171817" />
      <stop offset="1" stop-color="#928874" />
    </linearGradient>
    <radialGradient
      id="tile-highlight"
      cx="0"
      cy="0"
      r="1"
      gradientTransform="translate(78 78) rotate(-135) scale(58 62)"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#aaa08b" stop-opacity="0.42" />
      <stop offset="1" stop-color="#aaa08b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="96" height="94" rx="4" fill="url(#tile-gradient)" />
  <rect width="96" height="94" rx="4" fill="url(#tile-highlight)" />

  <text
    x="48"
    y="59"
    fill="#fff"
    font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="28"
    font-weight="300"
    letter-spacing="0.3"
    text-anchor="middle"
  >MC</text>

  <text
    x="119"
    y="59"
    fill="#fff"
    font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="38"
    font-weight="400"
  >Studio</text>
</svg>
